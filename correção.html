<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="img.ico/sol.ico.ico" type="image/x-icon">
    <title>LoFi.com - Relaxe e Ouça</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
            color: #ff6b6b;
            font-family: 'Georgia', serif;
            line-height: 1.6;
            min-height: 100vh;
            overflow-x: hidden;
        }

        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            text-align: center;
        }

        .header {
            margin-bottom: 40px;
            animation: fadeInDown 1s ease-out;
        }

        .main-title {
            font-size: clamp(2rem, 5vw, 4rem);
            font-weight: bold;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
            margin-bottom: 20px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .subtitle {
            font-size: clamp(1.2rem, 3vw, 2rem);
            margin-bottom: 15px;
            color: #ff8e8e;
            animation: fadeInUp 1s ease-out 0.3s both;
        }

        .description {
            font-size: clamp(1rem, 2.5vw, 1.5rem);
            margin-bottom: 30px;
            color: #ffb3b3;
            animation: fadeInUp 1s ease-out 0.6s both;
        }

        .media-section {
            margin: 40px 0;
            padding: 20px;
            background: rgba(255, 255, 255, 0.05);
            border-radius: 15px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
            animation: fadeInUp 1s ease-out 0.9s both;
        }

        .audio-player {
            width: 100%;
            max-width: 500px;
            margin: 20px auto;
            border-radius: 10px;
            background: rgba(255, 107, 107, 0.1);
            padding: 10px;
        }

        .audio-player audio {
            width: 100%;
            border-radius: 8px;
        }

        .lofi-image {
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
            transition: transform 0.3s ease;
        }

        .lofi-image:hover {
            transform: scale(1.02);
        }

        .lofi-image img {
            width: 100%;
            max-width: 780px;
            height: auto;
            display: block;
            border-radius: 15px;
        }

        .video-container {
            margin: 30px 0;
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(255, 107, 107, 0.3);
        }

        .video-container video {
            width: 100%;
            max-width: 720px;
            height: auto;
            border-radius: 15px;
        }

        .cta-link {
            display: inline-block;
            margin-top: 30px;
            padding: 15px 30px;
            background: linear-gradient(45deg, #ff6b6b, #ffa500);
            color: white;
            text-decoration: none;
            border-radius: 25px;
            font-size: 1.1rem;
            font-weight: bold;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(255, 107, 107, 0.4);
        }

        .cta-link:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(255, 107, 107, 0.6);
            background: linear-gradient(45deg, #ff8e8e, #ffb347);
        }

        .floating-elements {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -1;
        }

        .floating-note {
            position: absolute;
            color: rgba(255, 107, 107, 0.3);
            font-size: 20px;
            animation: float 6s ease-in-out infinite;
        }

        .floating-note:nth-child(1) { top: 20%; left: 10%; animation-delay: 0s; }
        .floating-note:nth-child(2) { top: 60%; right: 15%; animation-delay: 2s; }
        .floating-note:nth-child(3) { bottom: 30%; left: 20%; animation-delay: 4s; }

        @keyframes fadeInDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeInUp {
            from {
                opacity: 0;
                transform: translateY(30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes float {
            0%, 100% { transform: translateY(0px); }
            50% { transform: translateY(-20px); }
        }

        /* Responsividade */
        @media (max-width: 768px) {
            .container {
                padding: 15px;
            }
            
            .media-section {
                padding: 15px;
                margin: 20px 0;
            }
            
            .lofi-image img {
                max-width: 100%;
            }
            
            .video-container video {
                max-width: 100%;
            }
        }

        /* Melhorias de acessibilidade */
        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        /* Focus states para acessibilidade */
        .cta-link:focus,
        audio:focus,
        video:focus {
            outline: 2px solid #ff6b6b;
            outline-offset: 2px;
        }
    </style>
</head>
<body>
    <div class="floating-elements">
        <div class="floating-note">♪</div>
        <div class="floating-note">♫</div>
        <div class="floating-note">♪</div>
    </div>

    <main class="container">
        <header class="header">
            <h1 class="main-title">Apenas Ouça e Relaxe</h1>
            <h2 class="subtitle">Esqueça seus problemas agora</h2>
            <p class="description">Essa é a sua hora de descansar</p>
        </header>

        <section class="media-section" aria-label="Reprodutor de áudio">
            <div class="audio-player">
                <audio controls preload="metadata" aria-label="Música LoFi para relaxar">
                    <source src="musica1.mpeg" type="audio/mpeg">
                    <p>Seu navegador não suporta o elemento de áudio. <a href="musica1.mpeg">Baixe a música aqui</a>.</p>
                </audio>
            </div>
        </section>

        <section class="media-section" aria-label="Imagem LoFi">
            <div class="lofi-image">
                <img src="img/lofi2.gif" 
                     alt="Animação LoFi relaxante" 
                     width="780" 
                     height="350"
                     loading="lazy">
            </div>
        </section>

        <section class="media-section" aria-label="Vídeo LoFi">
            <div class="video-container">
                <video width="720" 
                       height="540" 
                       controls 
                       preload="metadata"
                       aria-label="Vídeo LoFi para relaxar">
                    <source src="video1.mp4" type="video/mp4">
                    <p>Seu navegador não suporta o elemento de vídeo. <a href="video1.mp4">Baixe o vídeo aqui</a>.</p>
                </video>
            </div>
        </section>

        <footer>
            <a href="https://www.youtube.com/@JJOMEGA" 
               class="cta-link" 
               target="_blank" 
               rel="noopener noreferrer"
               aria-label="Inscreva-se no canal do JJ no YouTube (abre em nova aba)">
                Se inscreva lá no JJ
            </a>
        </footer>
    </main>
</body>
</html>
